schema_version: 1
run_group: small_pilot
api_base_url: https://openrouter.ai/api/v1

defaults:
  model: qwen/qwen3-30b-a3b-instruct-2507
  provider:
    only: ["siliconflow"]
    allow_fallbacks: false
  n_agents: 5
  n_countries: 1
  n_periods: 20
  seed: 6160
  theta_grid_mode: fixed_theta_grid
  theta_grid: [-2.0, -1.5, -1.0, -0.5, 0.0, 0.5, 1.0, 1.5, 2.0, 2.5]
  z_public: 0.0
  sigma: 0.3
  benefit: 1.0
  cost: 1.0
  max_concurrent: 30
  llm_max_retries: 5
  llm_empty_retries: 12
  temperature: 0.7
  expected_rows: 20
  power_target: small_pilot_descriptive
  exclusion_rules:
    - drop API-error and unparseable decisions from join_fraction_valid
    - report parse and API error rates by arm
    - trigger JOIN/STAY/drop missing-response sensitivity if arm error rates differ by more than 1 percentage point

arms:
  - arm_id: small_pure_qwen30
    claim: language_signal
    role: reader_only
    message_source: none
    message_transform: none
    signal_mode: normal
    decision_task: coordination
    message_stage_context: none
    decision_context: none
    belief_timing: none
    belief_information: none
    output_dir: CLEAN_RUN/output/small_pilot/small_pure_qwen30
    primary_outcomes: [join_fraction_valid]
    preregistered_comparisons: []

  - arm_id: small_scramble_qwen30
    claim: language_signal
    role: reader_only
    message_source: none
    message_transform: none
    signal_mode: scramble
    decision_task: coordination
    message_stage_context: none
    decision_context: none
    belief_timing: none
    belief_information: none
    output_dir: CLEAN_RUN/output/small_pilot/small_scramble_qwen30
    primary_outcomes: [join_fraction_valid]
    preregistered_comparisons:
      - treatment: small_scramble_qwen30
        control: small_pure_qwen30

  - arm_id: small_flip_qwen30
    claim: language_signal
    role: reader_only
    message_source: none
    message_transform: none
    signal_mode: flip
    decision_task: coordination
    message_stage_context: none
    decision_context: none
    belief_timing: none
    belief_information: none
    output_dir: CLEAN_RUN/output/small_pilot/small_flip_qwen30
    primary_outcomes: [join_fraction_valid]
    preregistered_comparisons:
      - treatment: small_flip_qwen30
        control: small_pure_qwen30

  - arm_id: small_comm_baseline_qwen30
    claim: sender_side_surveillance
    role: writer_and_reader
    message_source: live
    message_transform: none
    decision_task: coordination
    message_stage_context: none
    decision_context: none
    belief_timing: none
    belief_information: none
    output_dir: CLEAN_RUN/output/small_pilot/small_comm_baseline_qwen30
    primary_outcomes: [join_fraction_valid, message_sent]
    preregistered_comparisons: []

  - arm_id: small_surv_sender_only_qwen30
    claim: sender_side_surveillance
    role: writer_and_reader
    message_source: live
    message_transform: none
    decision_task: coordination
    message_stage_context: surveillance_full
    decision_context: none
    belief_timing: none
    belief_information: none
    output_dir: CLEAN_RUN/output/small_pilot/small_surv_sender_only_qwen30
    primary_outcomes: [join_fraction_valid, message_sent]
    preregistered_comparisons:
      - treatment: small_surv_sender_only_qwen30
        control: small_comm_baseline_qwen30

  - arm_id: small_direct_replay_qwen30
    claim: direct_coded_mechanism
    role: reader_with_fixed_messages
    message_source: message_bank
    message_bank_path: CLEAN_RUN/message_banks/direct_coded_pairs_small_pilot.parquet
    message_transform: direct
    decision_task: coordination
    message_stage_context: none
    decision_context: none
    belief_timing: pre
    belief_information: messages_included
    output_dir: CLEAN_RUN/output/small_pilot/small_direct_replay_qwen30
    primary_outcomes:
      - join_fraction_valid
      - belief_pre_success
      - belief_pre_join_share
      - belief_pre_shared_understanding
      - belief_pre_others_expect_join
    preregistered_comparisons: []

  - arm_id: small_coded_replay_qwen30
    claim: direct_coded_mechanism
    role: reader_with_fixed_messages
    message_source: message_bank
    message_bank_path: CLEAN_RUN/message_banks/direct_coded_pairs_small_pilot.parquet
    message_transform: coded
    decision_task: coordination
    message_stage_context: none
    decision_context: none
    belief_timing: pre
    belief_information: messages_included
    output_dir: CLEAN_RUN/output/small_pilot/small_coded_replay_qwen30
    primary_outcomes:
      - join_fraction_valid
      - belief_pre_success
      - belief_pre_join_share
      - belief_pre_shared_understanding
      - belief_pre_others_expect_join
    preregistered_comparisons:
      - treatment: small_coded_replay_qwen30
        control: small_direct_replay_qwen30
