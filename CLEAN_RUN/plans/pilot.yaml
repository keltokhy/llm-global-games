schema_version: 1
run_group: pilot
api_base_url: https://openrouter.ai/api/v1

defaults:
  model: mistralai/mistral-small-2603
  provider:
    only: ["mistral"]
    allow_fallbacks: false
  n_agents: 5
  n_countries: 1
  n_periods: 2
  seed: 5150
  theta_grid_mode: random_normal
  sigma: 0.3
  benefit: 1.0
  cost: 1.0
  max_concurrent: 10
  llm_max_retries: 5
  llm_empty_retries: 12
  temperature: 0.7
  power_target: pilot_smoke
  exclusion_rules:
    - drop API-error and unparseable decisions from join_fraction_valid
    - trigger missing-response sensitivity if arm error rates differ by more than 1 percentage point

arms:
  - arm_id: pilot_pure_mistral
    claim: language_signal
    role: reader_only
    message_source: none
    message_transform: none
    signal_mode: normal
    decision_task: coordination
    message_stage_context: none
    decision_context: none
    belief_timing: none
    belief_information: none
    output_dir: CLEAN_RUN/output/pilot/pilot_pure_mistral
    expected_rows: 2
    primary_outcomes:
      - join_fraction_valid
    preregistered_comparisons: []

  - arm_id: pilot_scramble_mistral
    claim: language_signal
    role: reader_only
    message_source: none
    message_transform: none
    signal_mode: scramble
    decision_task: coordination
    message_stage_context: none
    decision_context: none
    belief_timing: none
    belief_information: none
    output_dir: CLEAN_RUN/output/pilot/pilot_scramble_mistral
    expected_rows: 2
    primary_outcomes:
      - join_fraction_valid
    preregistered_comparisons:
      - treatment: pilot_scramble_mistral
        control: pilot_pure_mistral

  - arm_id: pilot_flip_mistral
    claim: language_signal
    role: reader_only
    message_source: none
    message_transform: none
    signal_mode: flip
    decision_task: coordination
    message_stage_context: none
    decision_context: none
    belief_timing: none
    belief_information: none
    output_dir: CLEAN_RUN/output/pilot/pilot_flip_mistral
    expected_rows: 2
    primary_outcomes:
      - join_fraction_valid
    preregistered_comparisons:
      - treatment: pilot_flip_mistral
        control: pilot_pure_mistral

  - arm_id: pilot_comm_baseline_mistral
    claim: sender_side_surveillance
    role: writer_and_reader
    message_source: live
    message_transform: none
    decision_task: coordination
    message_stage_context: none
    decision_context: none
    belief_timing: none
    belief_information: none
    output_dir: CLEAN_RUN/output/pilot/pilot_comm_baseline_mistral
    expected_rows: 2
    primary_outcomes:
      - join_fraction_valid
      - message_sent
    preregistered_comparisons: []

  - arm_id: pilot_surv_sender_only_mistral
    claim: sender_side_surveillance
    role: writer_and_reader
    message_source: live
    message_transform: none
    decision_task: coordination
    message_stage_context: surveillance_full
    decision_context: none
    belief_timing: none
    belief_information: none
    output_dir: CLEAN_RUN/output/pilot/pilot_surv_sender_only_mistral
    expected_rows: 2
    primary_outcomes:
      - join_fraction_valid
      - message_sent
    preregistered_comparisons:
      - treatment: pilot_surv_sender_only_mistral
        control: pilot_comm_baseline_mistral

  - arm_id: pilot_direct_replay_mistral
    claim: direct_coded_mechanism
    role: reader_with_fixed_messages
    message_source: message_bank
    message_bank_path: CLEAN_RUN/message_banks/direct_coded_pairs_pilot.parquet
    message_transform: direct
    decision_task: coordination
    message_stage_context: none
    decision_context: none
    belief_timing: pre
    belief_information: messages_included
    output_dir: CLEAN_RUN/output/pilot/pilot_direct_replay_mistral
    expected_rows: 2
    primary_outcomes:
      - join_fraction_valid
      - belief_pre_success
      - belief_pre_join_share
      - belief_pre_shared_understanding
      - belief_pre_others_expect_join
    preregistered_comparisons: []

  - arm_id: pilot_coded_replay_mistral
    claim: direct_coded_mechanism
    role: reader_with_fixed_messages
    message_source: message_bank
    message_bank_path: CLEAN_RUN/message_banks/direct_coded_pairs_pilot.parquet
    message_transform: coded
    decision_task: coordination
    message_stage_context: none
    decision_context: none
    belief_timing: pre
    belief_information: messages_included
    output_dir: CLEAN_RUN/output/pilot/pilot_coded_replay_mistral
    expected_rows: 2
    primary_outcomes:
      - join_fraction_valid
      - belief_pre_success
      - belief_pre_join_share
      - belief_pre_shared_understanding
      - belief_pre_others_expect_join
    preregistered_comparisons:
      - treatment: pilot_coded_replay_mistral
        control: pilot_direct_replay_mistral
