schema_version: 1
run_group: random_theta_pilot
api_base_url: https://openrouter.ai/api/v1

defaults:
  model: qwen/qwen3-30b-a3b-instruct-2507
  provider:
    only: ["siliconflow"]
    allow_fallbacks: false
  n_agents: 10
  n_countries: 1
  n_periods: 100
  seed: 5150
  theta_grid_mode: random_normal
  z_country_sd: 0.3
  z_period_sd: 0.05
  theta_sd: 1.0
  sigma: 0.3
  benefit: 1.0
  cost: 1.0
  max_concurrent: 30
  llm_max_retries: 5
  llm_empty_retries: 12
  temperature: 0.7
  expected_rows: 100
  power_target: random_theta_pilot_descriptive
  exclusion_rules:
    - drop API-error and unparseable decisions from join_fraction_valid
    - report parse and API error rates by arm
    - trigger JOIN/STAY/drop missing-response sensitivity if arm error rates differ by more than 1 percentage point

arms:
  - arm_id: random_pure_qwen30
    claim: language_signal
    role: reader_only
    message_source: none
    message_transform: none
    signal_mode: normal
    decision_task: coordination
    message_stage_context: none
    decision_context: none
    belief_timing: none
    belief_information: none
    output_dir: CLEAN_RUN/output/random_theta_pilot/random_pure_qwen30
    primary_outcomes: [join_fraction_valid]
    preregistered_comparisons: []

  - arm_id: random_scramble_qwen30
    claim: language_signal
    role: reader_only
    message_source: none
    message_transform: none
    signal_mode: scramble
    decision_task: coordination
    message_stage_context: none
    decision_context: none
    belief_timing: none
    belief_information: none
    output_dir: CLEAN_RUN/output/random_theta_pilot/random_scramble_qwen30
    primary_outcomes: [join_fraction_valid]
    preregistered_comparisons:
      - treatment: random_scramble_qwen30
        control: random_pure_qwen30

  - arm_id: random_flip_qwen30
    claim: language_signal
    role: reader_only
    message_source: none
    message_transform: none
    signal_mode: flip
    decision_task: coordination
    message_stage_context: none
    decision_context: none
    belief_timing: none
    belief_information: none
    output_dir: CLEAN_RUN/output/random_theta_pilot/random_flip_qwen30
    primary_outcomes: [join_fraction_valid]
    preregistered_comparisons:
      - treatment: random_flip_qwen30
        control: random_pure_qwen30

  - arm_id: random_comm_baseline_qwen30
    claim: sender_side_surveillance
    role: writer_and_reader
    message_source: live
    message_transform: none
    decision_task: coordination
    message_stage_context: none
    decision_context: none
    belief_timing: none
    belief_information: none
    output_dir: CLEAN_RUN/output/random_theta_pilot/random_comm_baseline_qwen30
    primary_outcomes: [join_fraction_valid, message_sent]
    preregistered_comparisons: []

  - arm_id: random_surv_sender_only_qwen30
    claim: sender_side_surveillance
    role: writer_and_reader
    message_source: live
    message_transform: none
    decision_task: coordination
    message_stage_context: surveillance_full
    decision_context: none
    belief_timing: none
    belief_information: none
    output_dir: CLEAN_RUN/output/random_theta_pilot/random_surv_sender_only_qwen30
    primary_outcomes: [join_fraction_valid, message_sent]
    preregistered_comparisons:
      - treatment: random_surv_sender_only_qwen30
        control: random_comm_baseline_qwen30

  - arm_id: random_direct_replay_qwen30
    claim: direct_coded_mechanism
    role: reader_with_fixed_messages
    message_source: message_bank
    message_bank_path: CLEAN_RUN/message_banks/direct_coded_pairs_random_theta_pilot.parquet
    message_transform: direct
    decision_task: coordination
    message_stage_context: none
    decision_context: none
    belief_timing: pre
    belief_information: messages_included
    output_dir: CLEAN_RUN/output/random_theta_pilot/random_direct_replay_qwen30
    primary_outcomes:
      - join_fraction_valid
      - belief_pre_success
      - belief_pre_join_share
      - belief_pre_shared_understanding
      - belief_pre_others_expect_join
    preregistered_comparisons: []

  - arm_id: random_coded_replay_qwen30
    claim: direct_coded_mechanism
    role: reader_with_fixed_messages
    message_source: message_bank
    message_bank_path: CLEAN_RUN/message_banks/direct_coded_pairs_random_theta_pilot.parquet
    message_transform: coded
    decision_task: coordination
    message_stage_context: none
    decision_context: none
    belief_timing: pre
    belief_information: messages_included
    output_dir: CLEAN_RUN/output/random_theta_pilot/random_coded_replay_qwen30
    primary_outcomes:
      - join_fraction_valid
      - belief_pre_success
      - belief_pre_join_share
      - belief_pre_shared_understanding
      - belief_pre_others_expect_join
    preregistered_comparisons:
      - treatment: random_coded_replay_qwen30
        control: random_direct_replay_qwen30
